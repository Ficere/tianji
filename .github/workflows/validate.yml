name: Validate Skill

on:
  push:
    branches: [master, main]
  pull_request:
    # 同时覆盖堆叠 PR（feat/** → fix/**），否则中间分支的 PR 不跑 CI
    branches: [master, main, 'fix/**', 'feat/**']

jobs:
  validate:
    name: Validate SKILL.md & Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml jsonschema

      - name: Assert runtime dependencies are importable
        # 防止 CI 在依赖缺失的降级路径上「假绿灯」通过
        run: |
          python - <<'PY'
          import importlib.util, sys
          missing = [m for m in ("zhdate", "timezonefinder", "pytz")
                     if not importlib.util.find_spec(m)]
          if missing:
              sys.exit(f"❌ 缺少运行时依赖: {', '.join(missing)}")
          print("✅ 运行时依赖齐备，脚本将以完整精度运行")
          PY

      - name: Validate SKILL.md frontmatter
        run: |
          python - <<'PY'
          import re, sys, yaml
          txt = open("SKILL.md", encoding="utf-8").read()
          m = re.match(r"^---\n(.*?)\n---", txt, re.DOTALL)
          assert m, "SKILL.md 缺少 YAML frontmatter"
          meta = yaml.safe_load(m.group(1))
          assert "name" in meta, "SKILL.md 缺少 name 字段"
          assert "description" in meta, "SKILL.md 缺少 description 字段"
          assert re.match(r"^[a-z0-9\-]+$", meta["name"]), "name 字段必须为小写字母/数字/连字符"
          assert len(meta["description"]) <= 1024, "description 字段超过 1024 字符"
          print(f"✅ SKILL.md 验证通过: name={meta['name']}, version={meta.get('metadata', {}).get('version', 'N/A')}")
          PY

      - name: Run unit test suite
        run: python tests/test_suite.py

      - name: Validate examples against reading schema
        run: |
          python - <<'PY'
          import glob, json, sys
          import jsonschema
          schema = json.load(open("schemas/reading_v8.schema.json", encoding="utf-8"))
          validator = jsonschema.Draft202012Validator(schema)
          failed = False
          for path in sorted(glob.glob("examples/*.json")):
              data = json.load(open(path, encoding="utf-8"))
              errors = sorted(validator.iter_errors(data), key=lambda e: e.path)
              if errors:
                  failed = True
                  print(f"❌ {path} 不符合 schema:")
                  for e in errors:
                      print(f"   - {'/'.join(str(p) for p in e.absolute_path)}: {e.message}")
              else:
                  print(f"✅ {path} 符合 schema")
          sys.exit(1 if failed else 0)
          PY

      - name: Check synastry score arithmetic in examples
        # 合盘各分项之和必须等于 total，防止示例内部自相矛盾
        run: |
          python - <<'PY'
          import glob, json, sys
          failed = False
          for path in sorted(glob.glob("examples/*.json")):
              data = json.load(open(path, encoding="utf-8"))
              cs = (data.get("synastry") or {}).get("composite_scores")
              if not cs:
                  continue
              parts = sum(v["score"] for k, v in cs.items() if k != "total")
              if parts != cs["total"]:
                  failed = True
                  print(f"❌ {path}: 分项之和 {parts} ≠ total {cs['total']}")
              else:
                  print(f"✅ {path}: 合盘分项之和 = total = {parts}")
          sys.exit(1 if failed else 0)
          PY

      - name: Check synastry contract against REAL script output
        # 关键：上一步只校验示例文件，抓不到「脚本实际算出105分」这类偏差。
        # 本步直接跑 analyze_synastry，并把三方口径（schema 上限 / SKILL.md / 真实输出）对齐。
        run: |
          python - <<'PY'
          import sys, json, random, itertools
          sys.path.insert(0, "scripts")
          from fortune_calc import analyze_person, analyze_synastry

          # 分值上限以 schema 为唯一真源
          schema = json.load(open("schemas/reading_v8.schema.json", encoding="utf-8"))
          def find_cs(node):
              if isinstance(node, dict):
                  if "composite_scores" in node.get("properties", {}):
                      return node["properties"]["composite_scores"]
                  for v in node.values():
                      r = find_cs(v)
                      if r: return r
              elif isinstance(node, list):
                  for v in node:
                      r = find_cs(v)
                      if r: return r
              return None
          cs_schema = find_cs(schema)
          assert cs_schema, "schema 中找不到 composite_scores 定义"
          bands = {
              k: v.get("properties", {}).get("score", {}).get("maximum")
              for k, v in cs_schema.get("properties", {}).items()
              if k != "total"
          }
          bands = {k: v for k, v in bands.items() if v is not None}
          print("schema 声明的分项上限:", bands, "→ 合计", sum(bands.values()))
          assert sum(bands.values()) == 100, f"schema 分项上限合计 {sum(bands.values())} ≠ 100"

          names = ["张伟", "李娜", "王芳", "刘洋", "陈静", "赵磊"]
          rnd = random.Random(20250101)
          failed = 0
          stats = {}
          for with_name in (True, False):
              for n in (2, 3, 5):
                  hi, lo = -1, 999
                  for _ in range(150):
                      members = [analyze_person({
                          "name": names[i % len(names)] if with_name else "",
                          "gender": "男" if i % 2 == 0 else "女",
                          "solar_date": f"{1950 + rnd.randint(0, 55)}-{rnd.randint(1,12):02d}-{rnd.randint(1,28):02d}",
                          "birth_time": f"{rnd.randint(0,23):02d}:00",
                      }) for i in range(n)]
                      r = analyze_synastry(members)
                      cs = r["composite_scores"]
                      for k, cap in bands.items():
                          sc = cs[k]["score"]
                          if not (0 <= sc <= cap):
                              failed += 1
                              print(f"❌ {n}人 {k}={sc} 超出 schema 上限 {cap}")
                      parts = round(sum(cs[k]["score"] for k in bands), 1)
                      if abs(parts - r["score"]) > 0.05:
                          failed += 1
                          print(f"❌ {n}人：分项之和 {parts} ≠ total {r['score']}")
                      if r["score"] > r["max_possible"] or r["max_possible"] > 100:
                          failed += 1
                          print(f"❌ {n}人：total {r['score']} / 满分 {r['max_possible']} 越界")
                      hi, lo = max(hi, r["score"]), min(lo, r["score"])
                  stats[(with_name, n)] = (lo, hi)
                  print(f"{'有' if with_name else '无'}姓名 {n}人：实测区间 {lo} ~ {hi}")

          # 量纲一致性：不同人数的实测上限不应相差过大（累加式评分会立刻暴露）
          highs = [v[1] for k, v in stats.items() if k[0]]
          if max(highs) - min(highs) > 25:
              failed += 1
              print(f"❌ 不同人数的得分上限差异过大 {highs}，疑似回退为累加式评分")

          print("✅ 合盘评分契约校验通过" if not failed else f"❌ 共 {failed} 处违约")
          sys.exit(1 if failed else 0)
          PY

      - name: Smoke test fortune_calc.py
        run: |
          cat > /tmp/test.json <<'EOF'
          {
            "members": [
              {"name": "测试", "gender": "男", "solar_date": "1994-04-15", "birth_time": "14:44",
               "birth_city": "北京"}
            ]
          }
          EOF
          python scripts/fortune_calc.py --input /tmp/test.json --output /tmp/out.json
          python - <<'PY'
          import json, sys
          d = json.load(open("/tmp/out.json", encoding="utf-8"))
          m = d["members"][0]
          assert m["bazi"] == ["甲戌", "戊辰", "辛未", "乙未"], f"四柱回归失败: {m['bazi']}"
          assert m["warnings"] == [], f"依赖齐备时不应有降级告警: {m['warnings']}"
          assert m["chenggu"]["总重数"] > 0, "称骨未计算"
          print("✅ fortune_calc.py 运行正常且无降级告警")
          PY

      - name: Smoke test name_wuge_calc.py
        run: |
          python scripts/name_wuge_calc.py --name "郭昱辰" > /tmp/name.json
          test -s /tmp/name.json && echo "✅ name_wuge_calc.py 运行正常"
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from name_wuge_calc import calc_wuge, detect_surname_len
          # 复姓自动识别回归
          assert detect_surname_len("欧阳娜娜") == 2
          assert detect_surname_len("司马相如") == 2
          assert detect_surname_len("张三丰") == 1
          assert detect_surname_len("欧阳") == 1  # 长度2不判复姓，否则名字为空
          r = calc_wuge("欧阳娜娜")
          assert r["姓名类型"] == "复姓复名", r["姓名类型"]
          assert r["姓氏字数"] == 2
          # 显式指定时不被自动识别覆盖
          assert calc_wuge("欧阳娜娜", 1)["姓氏字数"] == 1
          print("✅ 复姓自动识别回归通过")
          PY

      - name: Deep analysis invariants (喜忌互斥 / 五行全覆盖 / 用神在喜神内)
        run: |
          python - <<'PY'
          import sys, random
          sys.path.insert(0, "scripts")
          from fortune_calc import analyze_person
          random.seed(20260806)
          WX = {"木", "火", "土", "金", "水"}
          for i in range(120):
              y = 1940 + random.randint(0, 70)
              r = analyze_person({
                  "name": "测试", "gender": random.choice(["男", "女"]),
                  "solar_date": f"{y}-{random.randint(1,12):02d}-{random.randint(1,28):02d}",
                  "birth_time": f"{random.randint(0,23):02d}:{random.randint(0,59):02d}",
                  "birth_city": random.choice(["北京", "上海", ""]),
              })
              d = r.get("deep")
              assert d is not None, f"深层分析失败: {r['warnings']}"
              ys = d["yongshen"]
              flat = ys["喜神"] + ys["忌神"] + ys["仇神"] + ys["闲神"]
              assert len(flat) == len(set(flat)), f"五行重复归类 {flat}"
              assert set(flat) == WX, f"五行归类不全 {set(flat)}"
              assert not ys["用神"] or ys["用神"] in ys["喜神"], "用神不在喜神内"
              assert 0.1 <= ys["置信度"]["score"] <= 0.95 and ys["置信度"]["reasons"]
              assert 0 <= d["day_master"]["强弱分"] <= 100
              zr = d["zhi_relations"]
              assert zr["合会数"] + zr["刑冲数"] + zr["天干合数"] == len(zr["关系列表"])
              cv = d["cross_validation"]
              assert sum(cv["统计"].values()) == len(cv["检测项"])
          print("✅ 深层分析不变量校验通过（120 组随机命造）")
          PY

      - name: Smoke test generate_html.py
        run: |
          python scripts/generate_html.py --reading examples/example_personal.json --output /tmp/r1.html
          python scripts/generate_html.py --reading examples/example_synastry.json --output /tmp/r2.html
          test -s /tmp/r1.html && test -s /tmp/r2.html && echo "✅ generate_html.py 渲染正常"

      - name: Validate with gh skill (agentskills.io spec)
        continue-on-error: true
        run: |
          # gh skill 可选校验，若 CLI 未安装则跳过
          if command -v gh >/dev/null && gh skill --help >/dev/null 2>&1; then
            gh skill publish --dry-run || true
          else
            echo "⚠️  gh skill CLI 不可用，跳过"
          fi
